<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F7A847"/>
      <stop offset="100%" style="stop-color:#E8742D"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#F0E6DA"/>
    </linearGradient>
  </defs>
  <!-- Handle -->
  <rect x="68" y="62" width="24" height="14" rx="7" ry="7" fill="url(#ring)" transform="rotate(45 80 69)"/>
  <!-- Outer ring -->
  <circle cx="40" cy="40" r="36" fill="url(#ring)"/>
  <!-- Inner glass -->
  <circle cx="40" cy="40" r="28" fill="url(#glass)"/>
  <!-- Glass shine -->
  <ellipse cx="32" cy="28" rx="10" ry="6" fill="rgba(255,255,255,0.6)" transform="rotate(-20 32 28)"/>
  <!-- Person silhouette -->
  <circle cx="40" cy="34" r="8" fill="#3D2B1F"/>
  <ellipse cx="40" cy="54" rx="14" ry="10" fill="#3D2B1F"/>
</svg>